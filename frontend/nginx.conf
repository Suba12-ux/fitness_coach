server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Docker-овский DNS: переразрешаем имя backend, иначе после пересоздания
    # контейнера nginx держит старый IP и отдаёт 502.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream "backend:8000";

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------- API proxy
    location /workflow {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
    }

    location = /ready {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
    }

    # Swagger UI и OpenAPI доступны с того же порта, что и интерфейс.
    location /docs {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------- static files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
